# Self-hosted miniPC repo checks on GITHUB, for release branches.
#
# NARROWED on 2026-08-01 by CI: this used to also trigger on pushes to `main`.
# Forgejo Actions reads .github/workflows/ too, and this file targets the same
# [self-hosted, linux, minipc, intergalactic-ci] labels the Forgejo runner
# declares, so every push to main executed it TWICE on one capacity-1 runner -
# once per forge. Verified 2026-08-01: the single push after PR #60 merged
# produced Forgejo run 394 (this file) and run 400 (.forgejo/workflows/
# forgejo-ci.yml). That runner shares a box with the live Matrix stack.
#
# Push-to-main coverage was not dropped, it moved and improved:
#   - Forgejo push to main + EVERY Forgejo pull request -> the repo-checks job in
#     .forgejo/workflows/forgejo-ci.yml, which runs these same four scripts.
#   - GitHub pull requests -> .github/workflows/main.yml (pr-validation), which
#     already ran these same four scripts on every PR.
#   - GitHub default branch, daily -> .github/workflows/minipc-nightly.yml,
#     which had no .yml extension until 2026-08-01 and had therefore never
#     executed once.
#
# What remains unique to this file is `release/**`, which none of the above
# covers. That is the reason it still exists. If release branches ever gain
# coverage elsewhere, retire this file rather than leaving a third copy.

name: minipc-ci

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: minipc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-repo-checks:
    name: Safe miniPC repo checks
    if: >
      github.event.repository.private == true &&
      (
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
        startsWith(github.ref, 'refs/heads/release/')
      )
    runs-on: [self-hosted, linux, minipc, intergalactic-ci]
    timeout-minutes: 20

    env:
      CI_MINIPC_MODE: github
      MINIPC_CI_NO_DOCKER: '1'
      MINIPC_CI_NO_SECRETS: '1'

    steps:
      - name: Checkout trusted private repo source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Runner safety boundary
        shell: bash
        env:
          IG_EVENT_NAME: ${{ github.event_name }}
          IG_REF: ${{ github.ref }}
          IG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IG_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          IG_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          echo "Repository private: ${IG_REPOSITORY_PRIVATE}"
          echo "Event: ${IG_EVENT_NAME}"
          echo "Ref: ${IG_REF}"
          echo "Default branch: ${IG_DEFAULT_BRANCH}"
          echo "Runner OS: ${IG_RUNNER_OS}"
          echo "This workflow is limited to trusted refs."
          echo "This workflow does not request secrets, Docker, deploy, signing, or mirror access."

      - name: Check JSON
        shell: bash
        run: bash scripts/ci/check-json.sh

      - name: Check agent docs
        shell: bash
        run: bash scripts/ci/check-agent-docs.sh

      - name: Check release docs
        shell: bash
        run: bash scripts/ci/check-release-docs.sh

      - name: Check security docs
        shell: bash
        run: bash scripts/ci/check-security-docs.sh

      # Mirrors the Forgejo gate of the same name. Two gates that disagree are
      # worse than one gate, so this must stay in step with forgejo-ci.yml.
      - name: Check tooltip component
        shell: bash
        run: bash scripts/ci/check-tooltip-component.sh
