# Standalone native compile gate for the debug-only D3D11 game-capture POC.
#
# The main Windows native build intentionally excludes
# plugins/intergalactic_game_capture because that package is not an app
# dependency. A green flutter build therefore cannot prove these helper/hook
# sources compile. This workflow is the matching automatic gate for that
# orphaned native tree.

name: game-capture-native

on:
  workflow_dispatch:
  pull_request:
    # DRAFT GUARD, added 2026-08-03 by REVIEW. `ready_for_review` must be listed
    # explicitly: the default set is opened/synchronize/reopened, so without it a
    # PR opened as a draft would never run this gate when marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/game-capture-native.yml'
      - 'plugins/intergalactic_game_capture/**'

permissions:
  contents: read

concurrency:
  group: game-capture-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-game-capture-native:
    # Skipped while the PR is a draft. GitHub evaluates a pull_request `paths:`
    # filter against the PR's WHOLE DIFF, not the individual push - so on a sync
    # batch, which contains native, Kotlin and Dart files by definition, every
    # gate matches on every push and the filters cannot help. Measured on PR #94:
    # six pushes re-ran every heavy gate six times, ~636 billed minutes on one PR,
    # about a third of a monthly allowance.
    #
    # Work the review rounds with the PR as a DRAFT, then mark it ready once. The
    # gate then runs on the final state, which is the state that actually matters.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    name: Game capture native (${{ matrix.configuration }})
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      MSBUILDDISABLENODEREUSE: '1'
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show CMake version
        shell: pwsh
        run: cmake --version

      - name: Configure game-capture helper and hook
        shell: pwsh
        run: >
          cmake
          -S .\plugins\intergalactic_game_capture\windows
          -B .\build\game-capture-native
          -A x64

      - name: Build game-capture helper and hook
        shell: pwsh
        run: >
          cmake
          --build .\build\game-capture-native
          --config ${{ matrix.configuration }}
          --parallel

      - name: Verify expected native outputs
        shell: pwsh
        run: |
          $outputDir = Join-Path (Get-Location).Path "build\game-capture-native\${{ matrix.configuration }}"
          $expected = @(
            "intergalactic_game_capture_helper.exe",
            "intergalactic_game_capture_hook64.dll"
          )

          foreach ($name in $expected) {
            $path = Join-Path $outputDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing expected game-capture native output: $path"
            }
            Write-Host "[ok] $name"
          }

      - name: Gate coverage notice
        if: always()
        shell: pwsh
        run: |
          Write-Host "This job compiles only plugins/intergalactic_game_capture/windows."
          Write-Host "It does not run BG3, inject the hook, publish to LiveKit,"
          Write-Host "or validate patched libwebrtc/WebRTC gameplay streaming."
