name: docs-secret-scan

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'CHANGE_LOG.md'
      - '.github/scripts/scan-doc-secrets.sh'
      - '.github/workflows/docs-secret-scan.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CHANGE_LOG.md'
      - '.github/scripts/scan-doc-secrets.sh'
      - '.github/workflows/docs-secret-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-secret-scan:
    name: Docs/Changelog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: 'true'

      - name: Run docs secret scan
        env:
          GITHUB_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          GITHUB_HEAD_SHA: ${{ github.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: bash .github/scripts/scan-doc-secrets.sh
