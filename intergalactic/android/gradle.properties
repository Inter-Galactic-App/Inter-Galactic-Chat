org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
# Enabled 2026-08-05 by REVIEW, and deliberately paired with removing the
# unconditional Kotlin incremental-cache wipe from build_android.bat rather than
# landed on its own. Those two are one decision, not two: the build cache
# restores task OUTPUTS from a key over task inputs, so a Kotlin compile task
# that hits the cache is skipped rather than recompiled - which is exactly what
# the wipe existed to force. Enabling caching while keeping the wipe is the one
# combination that makes no sense.
#
# The cache is the better of the two mechanisms for what the wipe was probably
# guarding: this build rewrites android/app/build.gradle and settings.gradle on
# every run (the FCM toggle adds and removes 7 Firebase packages, and the OSS
# licence collector patches the same two files), so consecutive builds can see
# different dependency graphs. Cache keys include the compile classpath, so that
# churn is handled correctly by construction instead of by deleting state.
#
# VALIDATED 2026-08-05 across five real release builds. The agreed test was
# "byte-identical APK", which is IMPOSSIBLE here and would have failed forever:
# build_release.dart injects --dart-define=BUILD_DATE=<epoch millis>, so
# lib/*/libapp.so differs on every build by construction. The equivalent test
# that actually isolates this change - the wipe and the cache can only affect
# Kotlin/Java compilation - is per-entry CRC:
#
#   wiped-cache build vs cached build : 1191 entries, 1189 identical CRC.
#   The only two differences were lib/arm64-v8a/libapp.so and
#   lib/armeabi-v7a/libapp.so, same size, i.e. BUILD_DATE. classes.dex,
#   classes2.dex, resources.arsc and all 28 non-Flutter .so matched exactly.
#   Held across three consecutive cached builds, and across a build made AFTER
#   switching push mode to embedded-ntfy and back - the discriminating case for
#   the dependency-graph-churn hypothesis, which is therefore not reproducible.
#
# If a Kotlin fault ever does appear, `build_android.bat --clear-kotlin-caches`
# restores the old behaviour and the fault goes in environment-known-issues.md.
#
# Compatible with the 2026-05-29 resource throttles above: caching reduces work,
# it does not raise concurrency or heap.
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
# Disabled 2026-08-03 by REVIEW on evidence, not on principle. Jetifier rewrites
# every dependency jar to AndroidX at build time, and it is what OOM'd the first
# real run of the Android CI gate: `Java heap space` inside JetifyTransform
# while resolving :app:debugCompileClasspath, before any Kotlin compiled.
#
# `./gradlew checkJetifier` (AGP 8.11.1) was run against this exact dependency
# set: 12 projects checked, every one reported "does not use any legacy support
# libraries", none dissented. So the transform was doing real work on every
# build for no benefit.
#
# This is the primary fix for that OOM; the GRADLE_OPTS heap bump in
# .github/workflows/build-android.yml is now headroom rather than the remedy.
#
# MEASURED, because the obvious assumption is wrong: removing Jetifier did NOT
# make the build faster. The CI Android job took 26m46s with it and 26m48s
# without - a 2-second difference, i.e. none. Jetifier was a MEMORY problem, not
# a TIME problem: it needed a large heap spike inside a single transform while
# contributing almost nothing to wall-clock against Flutter's AOT and Gradle
# compile. Do not expect a speed-up locally either, and do not re-enable it
# hoping to trade time for memory - it buys neither.
#
# If a future dependency does drag in com.android.support, the build fails with
# a clear duplicate-class or missing-class error rather than silently
# misbehaving - re-run `./gradlew checkJetifier` before assuming otherwise.
android.enableJetifier=false
org.gradle.java.installations.fromEnv=JAVA_8_HOME,JAVA_17_HOME
# Hands ABI selection to android/app/build.gradle's per-buildType ndk.abiFilters.
#
# Without this, FlutterPlugin.kt clears every build type's abiFilters at
# plugin-apply time and substitutes its own DEFAULT_PLATFORMS (arm, arm64,
# x86_64). That happens BEFORE the app's android {} block is evaluated, so a
# buildType block there unions with Flutter's set rather than replacing it, and
# x86_64 survives into the release APK. Measured against Flutter 3.41.1 on
# 2026-08-05; the plugin's own comment claiming user abiFilters "take
# precedence" does not hold.
#
# READ BEFORE CHANGING: the plugin tests `project.hasProperty(...)`, so
# `disable-abi-filtering=false` DISABLES filtering just as surely as `=true`.
# To restore Flutter's behaviour, delete the line - do not set it to false.
#
# Both build types must then declare their own abiFilters, and app/build.gradle
# does: debug restates Flutter's three ABIs, release ships ARM only.
disable-abi-filtering=true
