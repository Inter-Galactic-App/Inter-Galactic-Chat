name: intergalactic
version: 0.8.0+993
publish_to: none
description: Inter Galactic is a fork of Commet
environment: 
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.38.4'
resolution: workspace

dependencies: 
  build: any
  build_config: ^1.1.1
  commet_calendar_widget:
    path: ../widgets/calendar
  matrix_widget_api:
    path: ../widgets/matrix_widget_api
  intergalactic_noise_suppression:
    path: ../plugins/intergalactic_noise_suppression
  intergalactic_windows_share:
    path: ../plugins/intergalactic_windows_share
  crypto: ^3.0.2
  desktop_drop: ^0.4.1
  desktop_notifications: ^0.6.3
  device_info_plus: ^11.3.0
  flutter_background_service: ^5.0.5
  flutter_blurhash: ^0.8.2
  flutter_markdown: ^0.6.9+1
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.0.7
  html: ^0.15.2
  html_unescape: ^2.0.0
  http: ^1.1.0
  implicitly_animated_list: ^2.2.0
  intl: any
  intl_utils: any
  just_the_tooltip: ^0.0.12
  media_kit: ^1.2.6 # Primary package.
  media_kit_libs_video: ^1.0.7 # Native video dependencies.
  media_kit_video: ^2.0.1 # For video rendering.
  mime: ^1.0.4
  pasteboard: ^0.2.0
  path: ^1.8.2
  path_provider: ^2.0.13
  permission_handler: ^11.0.1
  provider: ^6.0.0
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.2
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+4
  test: ^1.24.3
  unifiedpush: ^5.0.1
  universal_html: ^2.2.4
  url_launcher: ^6.1.11
  win_toast: ^0.4.0
  window_manager: ^0.5.1
  flutter: 
    sdk: flutter
  flutter_highlighter: 
    git: 
      url: https://github.com/commetchat/highlight.git
      ref: 4de60d39c9fe4b828f90a019d0afc89e713c704e
      path: ./flutter_highlighter
  flutter_html: 
    git:
      url: https://github.com/commetchat/flutter_html.git
      ref: 1a2539aa10047b557f590abe21e8a5be0a93be70
  flutter_local_notifications: 
    git: 
      url: https://github.com/commetchat/flutter_local_notifications.git
      ref: 93f906985388835d24eea13ae6ccd8ee656f2cf1
      path: ./flutter_local_notifications
  flutter_localizations: 
    sdk: flutter

  tiamat: 
    path: ../tiamat/
  matrix:
    git:
      url: https://github.com/commetchat/matrix-dart-sdk.git
      ref: upstream-v6.1.1
  matrix_dart_sdk_drift_db:
    git: 
      url: https://github.com/commetchat/matrix-dart-sdk-drift-db.git
      ref: bb1abba161bd0e7438aa50e4ba8fb46408b69e67

  starfield:
    git:
      url: https://github.com/lagmachine-com/starfield.git
      ref: 6e3dee6dd4f56c3d8afb180832c27418d101c86f
  sqlite3_flutter_libs: ^0.5.23
  fuzzy: ^0.5.1
  drift: ^2.28.1
  archive: ^3.6.1
  exif: ^3.3.0
  image: ^4.2.0
  livekit_client: ^2.5.1
  flutter_webrtc: ^1.2.0
  file_picker: ^10.2.0
  flutter_web_auth_2: ^4.1.0
  receive_intent:
    git:
      url: https://github.com/daadu/receive_intent
      ref: 12cb1ef04311ffd7a4ba0f651105a2364c6b2afb
  flutter_shortcuts_new: ^2.0.0
  flutter_vodozemac: ^0.5.0
  vodozemac: ^0.5.0
  flutter_rust_bridge: 2.11.1
  intl_translation: ^0.20.1
  flutter_secure_storage: ^9.2.4


  ## ---- Putting some extra lines in here to help git with the diff
  ## ---- Probably good to keep this stuff at the bottom of the list
  ## Begin Google Services Dependencies
  # firebase_core: 2.32.0
  # firebase_messaging: 14.7.10
  ## End Google Services Dependencies
  ## ----
  ## ----
  markdown: any
  collection: any
  webrtc_interface: any
  uuid: any
  flutter_background: ^1.3.0+1
  icalendar_parser: ^2.1.0
  image_picker: ^1.2.1
  image_picker_android: ^0.8.13+16
  image_picker_platform_interface: ^2.11.1
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  canonical_json: ^1.1.2
  cryptography: ^2.9.0
  crop_image: ^1.0.17
  dart_ipc: ^1.0.1
  dbus: ^0.7.11
  hotkey_manager: ^0.2.3
  launcher_entry: ^0.1.1
  camera: ^0.12.0+1
  qr_flutter: ^4.1.0
dependency_overrides:
  analyzer: ^7.3.0

  ## Calendar UI in this tree targets the Commet 2.0.0 fork.
  calendar_view:
    git:
      url: https://github.com/commetchat/flutter_calendar_view.git
      ref: fbd03769c8715cf43211dfb878640a5fc0133dbc

  ## For inline-reply 
  flutter_local_notifications_linux: 
    git: 
      url: https://github.com/commetchat/flutter_local_notifications.git
      ref: 93f906985388835d24eea13ae6ccd8ee656f2cf1
      path: ./flutter_local_notifications_linux

  ## fixes: https://github.com/dart-lang/tools/issues/2169
  markdown:
    git:
      url: https://github.com/Airyzz/dart-lang-tools
      ref: 5978dd83f263574a05db478bc1be6ce705517aac
      path: pkgs/markdown

  ## Fixes https://github.com/MixinNetwork/flutter-plugins/issues/457
  desktop_webview_window:
    git:
      url: https://github.com/commetchat/mixin-flutter-plugins.git
      ref: 82c19ad6ee5ac2b2acac6001d3e0cbefb90f1e22
      path: ./packages/desktop_webview_window

  ## Vendored 0.5.1 with Windows patches so the hidden-title-bar WindowProc
  ## delegate only affects the main window (not detached call/stream popouts)
  ## and the inverted Windows 11 build check no longer adds a 1px top inset.
  ## See plugins/window_manager/PATCHES.md.
  window_manager:
    path: ../plugins/window_manager

dev_dependencies: 
  drift_dev: ^2.28.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1
  msix: ^3.7.0
  pubspec_dependency_sorter: ^1.0.4
  flutter_test: 
    sdk: flutter
  integration_test: 
    sdk: flutter
  file: any
  
flutter_intl: 
  class_name: T
  main_locale: en
  arb_dir: assets/l10n

flutter_launcher_icons: 
  image_path: assets/images/app_icon/app_icon_filled.png
  image_path_android: assets/images/app_icon/light/app_icon_android.png
  adaptive_icon_background: '#00000000'
  adaptive_icon_foreground: assets/images/app_icon/light/app_icon_android.png
  web: 
    image_path: assets/images/app_icon/app_icon_transparent_cropped.png
    generate: true
  windows: 
    image_path: assets/images/app_icon/app_icon_rounded.png
    generate: true
    icon_size: 48
  macos: 
    image_path: assets/images/app_icon/app_icon_rounded.png
    generate: true
  ios: true
  image_path_ios: assets/images/app_icon/app_icon_rounded.png
  remove_alpha_ios: true
  android: true
  min_sdk_android: 16

flutter: 
  config:
    enable-lldb-debugging: false
  assets:
    - assets/themes/
    - assets/config/
    - assets/l10n/
    - assets/sound/
    - assets/images/app_icon/
    - assets/images/app_icon/light/
    - assets/images/app_icon/dark/
    - assets/images/notification_companion/
    - assets/images/effects/particles/
    - assets/images/placeholders/
    - assets/images/placeholders/photos/
    - assets/emoji_data/
    - assets/emoji_data/shortcodes/
    - assets/js/package/
    - assets/vodozemac/
    - assets/data/
  shaders: 
    - assets/shader/texture_coordinate.frag
    - assets/shader/constellation.frag
  fonts: 
    - family: Jellee
      fonts: 
        - asset: assets/font/jellee/Jellee-Bold.ttf
        
    - family: EmojiFont
      fonts: 
        - asset: assets/font/emoji-font/TwemojiCOLR.otf

    - family: RobotoCustom
      fonts: 
        - asset: assets/font/roboto/Roboto-Regular.ttf
        - asset: assets/font/roboto/Roboto-Bold.ttf
          weight: 700

    - family: NunitoSans
      fonts:
        - asset: assets/font/nunito/NunitoSans-VariableFont_YTLC,opsz,wdth,wght.ttf
        - asset: assets/font/nunito/NunitoSans-Italic-VariableFont_YTLC,opsz,wdth,wght.ttf
          style: italic

    - family: Code
      fonts: 
        - asset: assets/font/code/JetBrainsMono-Regular.ttf
  uses-material-design: true
  generate: true

msix_config: 
  display_name: Inter Galactic
  identity_name: chat.intergalactic.app.windows-832a9c4f
  msix_version: 0.8.0.993
  toast_activator: 
    clsid: A1F4D8E2-44E5-4A0A-8B91-8D2B18B9D832
    arguments: -ToastActivated
    display_name: Inter Galactic
